name: trading
channels:
  - defaults
  - conda-forge
dependencies:
  - python =3.8.*
  - pytest
  - scikit-learn
  - scikit-optimize
  - pandas
  - matplotlib
  - jupyter
  - requests
  - pip
  - pip:
      - tensorflow
      - ta
      # yfinance >=1.2.0 is required: earlier versions (incl. 0.2.x) use a cookie/crumb
      # flow that Yahoo's edge now rate-limits to HTTP 429 immediately. 1.2.0 reworked
      # auth and works against the current Yahoo API.
      - yfinance>=1.2.0
      # Editable install of this repo so `import exp` resolves from any cwd /
      # entry point (scripts, pytest, REPL) without PYTHONPATH. See pyproject.toml.
      - -e .
